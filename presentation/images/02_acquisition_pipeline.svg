<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#B8C4D6"/></marker>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#CBD5E1" flood-opacity=".65"/></filter>
</defs>
<rect width="100%" height="100%" fill="#F8FAFC"/>
<text x="40" y="48" font-family="Microsoft YaHei, SimHei, Arial" font-size="28" fill="#17202A" font-weight="900" text-anchor="start">采集端工作流：从预检到可追溯数据落盘</text>
<rect x="55" y="125" width="200" height="115" rx="8" fill="white" stroke="#B8C4D6" stroke-width="1.5" filter="url(#shadow)"/>
<text x="155.0" y="157" font-family="Microsoft YaHei, SimHei, Arial" font-size="18" fill="#17202A" font-weight="800" text-anchor="middle">设备预检</text>
<text x="155.0" y="195" font-family="Microsoft YaHei, SimHei, Arial" font-size="13" fill="#5D6D7E" font-weight="400" text-anchor="middle">IMU / USB / D435i /</text>
<text x="155.0" y="211" font-family="Microsoft YaHei, SimHei, Arial" font-size="13" fill="#5D6D7E" font-weight="400" text-anchor="middle">蓝牙遥控器在线检查；USB</text>
<text x="155.0" y="227" font-family="Microsoft YaHei, SimHei, Arial" font-size="13" fill="#5D6D7E" font-weight="400" text-anchor="middle">可按通道选择不使用</text>
<line x1="255" y1="182" x2="293" y2="182" stroke="#B8C4D6" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="295" y="125" width="200" height="115" rx="8" fill="white" stroke="#B8C4D6" stroke-width="1.5" filter="url(#shadow)"/>
<text x="395.0" y="157" font-family="Microsoft YaHei, SimHei, Arial" font-size="18" fill="#17202A" font-weight="800" text-anchor="middle">统一时间零点</text>
<text x="395.0" y="195" font-family="Microsoft YaHei, SimHei, Arial" font-size="13" fill="#5D6D7E" font-weight="400" text-anchor="middle">写入 recording_zero，所有</text>
<text x="395.0" y="211" font-family="Microsoft YaHei, SimHei, Arial" font-size="13" fill="#5D6D7E" font-weight="400" text-anchor="middle">CSV 时间戳相对</text>
<text x="395.0" y="227" font-family="Microsoft YaHei, SimHei, Arial" font-size="13" fill="#5D6D7E" font-weight="400" text-anchor="middle">session_start</text>
<line x1="495" y1="182" x2="533" y2="182" stroke="#B8C4D6" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="535" y="125" width="200" height="115" rx="8" fill="white" stroke="#B8C4D6" stroke-width="1.5" filter="url(#shadow)"/>
<text x="635.0" y="157" font-family="Microsoft YaHei, SimHei, Arial" font-size="18" fill="#17202A" font-weight="800" text-anchor="middle">并行采集</text>
<text x="635.0" y="195" font-family="Microsoft YaHei, SimHei, Arial" font-size="13" fill="#5D6D7E" font-weight="400" text-anchor="middle">IMU UDP 队列写盘；USB</text>
<text x="635.0" y="211" font-family="Microsoft YaHei, SimHei, Arial" font-size="13" fill="#5D6D7E" font-weight="400" text-anchor="middle">QMediaRecorder；D435i</text>
<text x="635.0" y="227" font-family="Microsoft YaHei, SimHei, Arial" font-size="13" fill="#5D6D7E" font-weight="400" text-anchor="middle">独立线程与磁盘队列</text>
<line x1="735" y1="182" x2="773" y2="182" stroke="#B8C4D6" stroke-width="2.2" marker-end="url(#arrow)"/>
