<text x="830.0" y="352" font-family="Microsoft YaHei, SimHei, Arial" font-size="18" fill="#7C3AED" font-weight="800" text-anchor="middle">标签编辑</text>
<text x="830.0" y="390" font-family="Microsoft YaHei, SimHei, Arial" font-size="13" fill="#5D6D7E" font-weight="400" text-anchor="middle">表格编辑 FOG / 二/三分类模式</text>
<rect x="965" y="320" width="200" height="90" rx="8" fill="white" stroke="#10A66A" stroke-width="1.5" filter="url(#shadow)"/>
<text x="1065.0" y="352" font-family="Microsoft YaHei, SimHei, Arial" font-size="18" fill="#10A66A" font-weight="800" text-anchor="middle">导出</text>
<text x="1065.0" y="390" font-family="Microsoft YaHei, SimHei, Arial" font-size="13" fill="#5D6D7E" font-weight="400" text-anchor="middle">imu_labeled /</text>
<text x="1065.0" y="406" font-family="Microsoft YaHei, SimHei, Arial" font-size="13" fill="#5D6D7E" font-weight="400" text-anchor="middle">time_labeled</text>
<line x1="590" y1="295" x2="690" y2="295" stroke="#B8C4D6" stroke-width="2.2" marker-end="url(#arrow)"/>
</svg>
