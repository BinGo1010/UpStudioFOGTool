<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#B8C4D6"/></marker>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#CBD5E1" flood-opacity=".65"/></filter>
</defs>
<rect width="100%" height="100%" fill="#F8FAFC"/>
<text x="40" y="48" font-family="Microsoft YaHei, SimHei, Arial" font-size="28" fill="#17202A" font-weight="900" text-anchor="start">界面组织与实验操作路径</text>
<rect x="70" y="115" width="520" height="360" rx="8" fill="white" stroke="#2F6BFF" stroke-width="1.5" filter="url(#shadow)"/>
<text x="330.0" y="147" font-family="Microsoft YaHei, SimHei, Arial" font-size="18" fill="#2F6BFF" font-weight="800" text-anchor="middle">Page1 采集页</text>
<text x="330.0" y="185" font-family="Microsoft YaHei, SimHei, Arial" font-size="13" fill="#5D6D7E" font-weight="400" text-anchor="middle">面向实验现场：连设备、看状态、开始/停止采集、遥控打标</text>
<rect x="110" y="190" width="200" height="90" rx="8" fill="white" stroke="#10A66A" stroke-width="1.5" filter="url(#shadow)"/>
<text x="210.0" y="222" font-family="Microsoft YaHei, SimHei, Arial" font-size="18" fill="#10A66A" font-weight="800" text-anchor="middle">IMU 实时页</text>
<text x="210.0" y="260" font-family="Microsoft YaHei, SimHei, Arial" font-size="13" fill="#5D6D7E" font-weight="400" text-anchor="middle">5 路状态表 / 6 个实时曲线</text>
<rect x="345" y="190" width="200" height="90" rx="8" fill="white" stroke="#00A7C7" stroke-width="1.5" filter="url(#shadow)"/>
<text x="445.0" y="222" font-family="Microsoft YaHei, SimHei, Arial" font-size="18" fill="#00A7C7" font-weight="800" text-anchor="middle">视频预览页</text>
<text x="445.0" y="260" font-family="Microsoft YaHei, SimHei, Arial" font-size="13" fill="#5D6D7E" font-weight="400" text-anchor="middle">USB / D435i 分页 /</text>
<text x="445.0" y="276" font-family="Microsoft YaHei, SimHei, Arial" font-size="13" fill="#5D6D7E" font-weight="400" text-anchor="middle">各自刷新按钮</text>
<rect x="110" y="320" width="200" height="90" rx="8" fill="white" stroke="#F59E0B" stroke-width="1.5" filter="url(#shadow)"/>
<text x="210.0" y="352" font-family="Microsoft YaHei, SimHei, Arial" font-size="18" fill="#F59E0B" font-weight="800" text-anchor="middle">采集控制</text>
<text x="210.0" y="390" font-family="Microsoft YaHei, SimHei, Arial" font-size="13" fill="#5D6D7E" font-weight="400" text-anchor="middle">预检、保存路径 / D435i 开关</text>
<rect x="345" y="320" width="200" height="90" rx="8" fill="white" stroke="#7C3AED" stroke-width="1.5" filter="url(#shadow)"/>
<text x="445.0" y="352" font-family="Microsoft YaHei, SimHei, Arial" font-size="18" fill="#7C3AED" font-weight="800" text-anchor="middle">遥控与校准</text>
<text x="445.0" y="390" font-family="Microsoft YaHei, SimHei, Arial" font-size="13" fill="#5D6D7E" font-weight="400" text-anchor="middle">双击实验标签 / 角度置零/基线</text>
<rect x="690" y="115" width="520" height="360" rx="8" fill="white" stroke="#E45757" stroke-width="1.5" filter="url(#shadow)"/>
<text x="950.0" y="147" font-family="Microsoft YaHei, SimHei, Arial" font-size="18" fill="#E45757" font-weight="800" text-anchor="middle">Page2 标注页</text>
<text x="950.0" y="185" font-family="Microsoft YaHei, SimHei, Arial" font-size="13" fill="#5D6D7E" font-weight="400" text-anchor="middle">面向离线整理：同步回放、修正 FOG 区间、导出训练标签</text>
